name: Build and Push Docker Images

# Publishes multi-arch (amd64 + arm64) images to GitHub Container Registry using
# the built-in GITHUB_TOKEN; no registry secrets are needed. Pull requests build
# both architectures without pushing, so a broken Dockerfile is caught pre-merge.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "frontend/**"
      - "docker/app/Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "src/**"
      - "frontend/**"
      - "docker/app/Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: local-vss-api
            context: .
            file: docker/app/Dockerfile
          - image: local-vss-frontend
            context: ./frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/raidowl/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
