# AMD GPU (ROCm) override. Use with:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.rocm.yml   (setup.sh sets this)
# Requires Docker Compose >= 2.24.0 for the !reset merge tag.
#
# VLLM_ROCM_IMAGE must match your GPU family (setup.sh picks it from the GPU's
# gfx target):
#   RDNA 3 / 3.5 / 4 (Radeon RX 7000/9000, Radeon AI PRO, Strix Halo / Point)
#     rocm/vllm:rocm7.14.1_rdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0
#   CDNA 3+ (Instinct MI300 / MI325 / MI350)
#     rocm/vllm:rocm7.14.1_cdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0
# Quantization is chosen per GPU by docker/vllm/serve.py (fp8 on MI300+, BF16 on
# RDNA, which has no FP8 support in vLLM).

x-amd-gpu: &amd-gpu
  image: ${VLLM_ROCM_IMAGE:-rocm/vllm:rocm7.14.1_rdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0}
  deploy:
    resources:
      reservations:
        devices: !reset []
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  security_opt:
    - seccomp:unconfined

services:
  local-vss-api:
    # GPU video decode (VAAPI) for frame extraction
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined
    environment:
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL:-auto}

  vllm-embed:
    <<: *amd-gpu

  vllm-main:
    <<: *amd-gpu
