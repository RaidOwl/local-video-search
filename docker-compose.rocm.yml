# AMD GPU (ROCm) override for HARDWARE_TYPE=amd and amd-vllm. Use with:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.rocm.yml   (setup.sh sets this)
# Requires Docker Compose >= 2.24.0 for the !reset merge tag.
#
# It adds GPU video decode (VAAPI) to the API and swaps the vLLM services to the
# ROCm image (amd-vllm only). The default Ollama service (ollama-amd) is fully
# defined in docker-compose.yml and needs nothing from this file.
#
# VLLM_ROCM_IMAGE is set by setup.sh from the GPU's gfx target. The rocm10.x
# images are unified (one tag covers both families):
#   RDNA 3 / 3.5 / 4 (Radeon RX 7000/9000, Radeon AI PRO, Strix Halo / Point)
#   CDNA 3+ (Instinct MI300 / MI325 / MI350)
#     rocm/vllm:rocm10.1.0_ubuntu24.04_py3.14-pytorch_2.13.0_vllm-0.29.0
# Quantization is chosen per GPU by docker/vllm/serve.py (fp8 on MI300+, BF16 on
# RDNA, which has no FP8 support in vLLM).

x-amd-gpu: &amd-gpu
  image: ${VLLM_ROCM_IMAGE:-rocm/vllm:rocm10.1.0_ubuntu24.04_py3.14-pytorch_2.13.0_vllm-0.29.0}
  deploy:
    resources:
      reservations:
        devices: !reset []
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  security_opt:
    - seccomp:unconfined

services:
  local-vss-api:
    # GPU video decode (VAAPI) for frame extraction
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined
    environment:
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL:-auto}

  vllm-embed:
    <<: *amd-gpu

  vllm-main:
    <<: *amd-gpu
