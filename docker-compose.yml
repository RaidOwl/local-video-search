# ── How to run ──────────────────────────────────────────────────────────────
#
#  Custom mode  (default, bring your own models):
#    docker compose up -d
#
#  Ollama in Docker  (CPU or NVIDIA GPU on Linux):
#    AI_BACKEND=ollama docker compose --profile ollama up -d
#
#  Ollama on host  (BEST for Apple Silicon — full Metal acceleration):
#    brew install ollama && ollama serve   ← run on Mac host
#    AI_BACKEND=ollama-native docker compose up -d
#
#  vLLM  (NVIDIA GPU required, needs nvidia-container-toolkit):
#    AI_BACKEND=vllm docker compose --profile vllm up -d
#
# ────────────────────────────────────────────────────────────────────────────

services:

  # ── Core ──────────────────────────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-vss-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  local-vss-api:
    image: raidowl/local-vss-api:latest
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: local-vss-api
    environment:
      # Deployment mode (set in .env)
      AI_BACKEND: ${AI_BACKEND:-custom}
      VRAM_TIER: ${VRAM_TIER:-mid}
      MODEL_FAMILY: ${MODEL_FAMILY:-qwen}
      # Custom-mode endpoints (ignored in local modes — auto-configured).
      # Backend-agnostic: may point at vLLM, Ollama, MLX, or a cloud API.
      EMBED_URL: ${EMBED_URL:-http://localhost:8001}
      VLM_URL: ${VLM_URL:-http://localhost:8002}
      LLM_URL: ${LLM_URL:-http://localhost:8000}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      VLM_MODEL: ${VLM_MODEL:-llava-hf/llava-v1.6-vicuna-7b-hf}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-8B}
      # Infrastructure
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite+aiosqlite:////data/metadata.db
      FRAME_EXTRACTION_INTERVAL: ${FRAME_EXTRACTION_INTERVAL:-5}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-16}
      # Cache HuggingFace models (reranker, etc.) under the shared models volume
      HF_HOME: /models/huggingface
    volumes:
      # Model weights — relocate to a larger drive by setting MODELS_DIR in .env
      - ${MODELS_DIR:-./data/models}:/models
      # Up to 5 video library directories — set VIDEO_DIR_1..5 in .env
      # Unused slots default to ./data/placeholder (empty dir, auto-created by Docker)
      - ${VIDEO_DIR_1:-./data/videos}:/data/videos/lib1:ro
      - ${VIDEO_DIR_2:-./data/placeholder}:/data/videos/lib2:ro
      - ${VIDEO_DIR_3:-./data/placeholder}:/data/videos/lib3:ro
      - ${VIDEO_DIR_4:-./data/placeholder}:/data/videos/lib4:ro
      - ${VIDEO_DIR_5:-./data/placeholder}:/data/videos/lib5:ro
      - ./data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The API reports healthy within ~15-30s, then warms the reranker (which
      # stalls /health while it loads and, on first run, downloads ~1.1 GB). The
      # long start_period keeps those warmup stalls from flipping the container
      # to "unhealthy" before the model finishes, so dependents waiting on
      # service_healthy aren't disturbed.
      start_period: 300s
    restart: unless-stopped

  local-vss-frontend:
    image: raidowl/local-vss-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: local-vss-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      local-vss-api:
        condition: service_healthy
    restart: unless-stopped

  # ── Ollama profile ────────────────────────────────────────────────────────
  # Start with: docker compose --profile ollama up -d
  # Note: on Apple Silicon use AI_BACKEND=ollama-native instead (runs on host)

  ollama:
    image: ollama/ollama:latest
    container_name: local-vss-ollama
    profiles: [ollama]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${MODELS_DIR:-./data/models}/ollama:/root/.ollama
    # GPU support — remove the deploy block if running CPU-only
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: local-vss-ollama-init
    profiles: [ollama]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_FAMILY: ${MODEL_FAMILY:-qwen}
      VRAM_TIER: ${VRAM_TIER:-mid}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Resolve model names from MODEL_FAMILY + VRAM_TIER
        if [ "$$MODEL_FAMILY" = "gemma" ]; then
          case "$$VRAM_TIER" in
            low)   MAIN_MODEL="gemma3:4b"  ;;
            high)  MAIN_MODEL="gemma3:27b" ;;
            ultra) MAIN_MODEL="gemma3:27b" ;;
            *)     MAIN_MODEL="gemma3:12b" ;;
          esac
        else
          case "$$VRAM_TIER" in
            low)   MAIN_MODEL="qwen2.5vl:3b"  ;;
            high)  MAIN_MODEL="qwen2.5vl:32b" ;;
            ultra) MAIN_MODEL="qwen2.5vl:72b" ;;
            *)     MAIN_MODEL="qwen2.5vl:7b"  ;;
          esac
        fi
        EMBED_MODEL="bge-m3"
        echo "==> Waiting for Ollama to be ready..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "==> Pulling embed model: $$EMBED_MODEL"
        ollama list | grep -q "$$EMBED_MODEL" || ollama pull "$$EMBED_MODEL"
        echo "==> Pulling main model: $$MAIN_MODEL"
        ollama list | grep -q "$$MAIN_MODEL" || ollama pull "$$MAIN_MODEL"
        echo "==> Models ready."
    restart: "no"

  # ── vLLM profile ──────────────────────────────────────────────────────────
  # Start with: docker compose --profile vllm up -d
  # Requires: NVIDIA GPU + nvidia-container-toolkit installed on host
  # One multimodal model handles both vision captioning and summarization.

  vllm-embed:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: local-vss-vllm-embed
    profiles: [vllm]
    command:
      - --model
      - ${EMBED_MODEL:-BAAI/bge-m3}
      - --port
      - "8001"
      - --host
      - "0.0.0.0"
      - --task
      - embed
    # No host port binding needed — the API reaches this via Docker's internal
    # network (http://vllm-embed:8001). Uncomment to expose for external access:
    # ports:
    #   - "${VLLM_EMBED_PORT:-8001}:8001"
    volumes:
      - ${MODELS_DIR:-./data/models}/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  vllm-main:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: local-vss-vllm-main
    profiles: [vllm]
    # The VLM model is auto-selected from MODEL_FAMILY + VRAM_TIER, matching the
    # API's tier registry (src/local_models.py) so the container and the API
    # always agree on which model is loaded. Change the model by setting
    # VRAM_TIER (low | mid | high | ultra) in .env — no separate model var.
    environment:
      MODEL_FAMILY: ${MODEL_FAMILY:-qwen}
      VRAM_TIER: ${VRAM_TIER:-mid}
      # Non-VLLM_-prefixed names so vLLM doesn't flag them as unknown env vars
      MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-16384}
      QUANTIZATION: ${VLLM_QUANTIZATION:-fp8}
      # "auto" lets the entrypoint scale the memory cap to VRAM_TIER so a small
      # model on a large (unified-memory) box doesn't reserve the whole pool.
      GPU_MEMORY_UTIL: ${VLLM_GPU_MEMORY_UTIL:-auto}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Resolve the VLM model (HF repo IDs) from MODEL_FAMILY + VRAM_TIER.
        # Keep these mappings in sync with TIER_MODELS in src/local_models.py.
        if [ "$$MODEL_FAMILY" = "gemma" ]; then
          case "$$VRAM_TIER" in
            low)   MAIN_MODEL="google/gemma-3-4b-it"  ;;
            high)  MAIN_MODEL="google/gemma-3-12b-it" ;;
            ultra) MAIN_MODEL="google/gemma-3-27b-it" ;;
            *)     MAIN_MODEL="google/gemma-3-12b-it" ;;
          esac
        else
          case "$$VRAM_TIER" in
            low)   MAIN_MODEL="Qwen/Qwen2.5-VL-3B-Instruct"  ;;
            high)  MAIN_MODEL="Qwen/Qwen2.5-VL-32B-Instruct" ;;
            ultra) MAIN_MODEL="Qwen/Qwen2.5-VL-72B-Instruct" ;;
            *)     MAIN_MODEL="Qwen/Qwen2.5-VL-7B-Instruct"  ;;
          esac
        fi
        # Auto-scale the GPU memory cap to the tier when not pinned explicitly,
        # so a small model on a large (e.g. unified-memory) box doesn't reserve
        # the whole pool just for KV cache. Override with VLLM_GPU_MEMORY_UTIL.
        if [ "$$GPU_MEMORY_UTIL" = "auto" ]; then
          case "$$VRAM_TIER" in
            low)   GPU_MEMORY_UTIL="0.25" ;;
            high)  GPU_MEMORY_UTIL="0.60" ;;
            ultra) GPU_MEMORY_UTIL="0.92" ;;
            *)     GPU_MEMORY_UTIL="0.35" ;;
          esac
        fi
        echo "==> Starting vLLM (family=$$MODEL_FAMILY tier=$$VRAM_TIER) model=$$MAIN_MODEL gpu_mem_util=$$GPU_MEMORY_UTIL"
        exec python3 -m vllm.entrypoints.openai.api_server \
          --model "$$MAIN_MODEL" \
          --port 8002 \
          --host 0.0.0.0 \
          --max-model-len "$$MAX_MODEL_LEN" \
          --quantization "$$QUANTIZATION" \
          --gpu-memory-utilization "$$GPU_MEMORY_UTIL" \
          --enforce-eager
    # No host port binding needed — the API reaches this via Docker's internal
    # network (http://vllm-main:8002). Uncomment to expose for external access:
    # ports:
    #   - "${VLLM_MAIN_PORT:-8002}:8002"
    volumes:
      - ${MODELS_DIR:-./data/models}/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Model cache management ────────────────────────────────────────────────
  # List cached models and their disk usage:
  #   docker compose --profile prune run --rm cache-list
  #
  # Delete all cached model weights (vLLM + Ollama). Models re-download on
  # next startup. Stop running model containers first.
  #   docker compose --profile prune run --rm cache-purge

  cache-list:
    image: alpine
    container_name: local-vss-cache-list
    profiles: [prune]
    volumes:
      - ${MODELS_DIR:-./data/models}:/models
    command:
      - sh
      - -c
      - |
        echo "=== HuggingFace models (reranker / vLLM / embed) ==="
        du -sh /models/huggingface/hub/models--* 2>/dev/null \
          | sort -h \
          | sed 's|.*/models--||; s|--|/|' \
          || echo "  (none)"
        echo ""
        echo "=== Ollama models ==="
        du -sh /models/ollama/models/manifests/registry.ollama.ai/*/* 2>/dev/null \
          | sort -h \
          | sed 's|.*/||' \
          || echo "  (none)"
    restart: "no"

  cache-purge:
    image: alpine
    container_name: local-vss-cache-purge
    profiles: [prune]
    volumes:
      - ${MODELS_DIR:-./data/models}:/models
    command:
      - sh
      - -c
      - |
        echo "Clearing HuggingFace cache..."
        rm -rf /models/huggingface/hub && echo "  done"
        echo "Clearing Ollama cache..."
        rm -rf /models/ollama/models && echo "  done"
        echo "All model weights removed. They will re-download on next startup."
    restart: "no"
