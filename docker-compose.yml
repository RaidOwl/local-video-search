# ── How to run ──────────────────────────────────────────────────────────────
#
#  1. Copy .env.example to .env (or run ./setup.sh, which does all of this)
#  2. Set HARDWARE_TYPE to your platform
#  3. docker compose up -d
#
#  HARDWARE_TYPE determines which AI backend is used:
#    nvidia      → Ollama container on the NVIDIA GPU (needs nvidia-container-toolkit)
#    amd         → Ollama container on the AMD GPU (ROCm)
#    cpu         → Ollama container on CPU (slow)
#    apple       → Ollama on the host with Metal (brew install ollama && ollama serve)
#    native      → Ollama on the host (any GPU Ollama supports, e.g. Intel Arc)
#    nvidia-vllm → opt-in: vLLM containers on the NVIDIA GPU (24 GB+)
#    amd-vllm    → opt-in: vLLM containers on the AMD GPU (24 GB+, needs
#                  COMPOSE_FILE=docker-compose.yml:docker-compose.rocm.yml)
#    custom      → Bring your own endpoints (set CUSTOM MODE in .env)
#
#  COMPOSE_PROFILES=${HARDWARE_TYPE} in .env auto-starts the right containers.
# ────────────────────────────────────────────────────────────────────────────

# Ollama in Docker, shared by the cpu / nvidia / amd variants below. On start it
# pulls the models for MODEL_FAMILY + VRAM_TIER (these names must match
# src/local_models.py TIER_MODELS["ollama"]) and then serves them.
x-ollama: &ollama
  image: ollama/ollama:0.40.15
  environment:
    MODEL_FAMILY: ${MODEL_FAMILY:-qwen}
    VRAM_TIER: ${VRAM_TIER:-mid}
    # Ollama sizes the context window from free memory (up to 256k on big
    # GPUs), which balloons the KV cache. The app's prompts fit well within 8k.
    OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    # Requests served at once per model. Each slot adds a full context of KV
    # cache, so raise it only with memory to spare (~+1 GB per slot on mid).
    OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    # Keep the embedder and the vision model resident together, indefinitely:
    # analysis calls them hundreds of times per video.
    OLLAMA_MAX_LOADED_MODELS: "2"
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
  entrypoint:
    - /bin/sh
    - -c
    - |
      # Only low/mid are served locally; high/ultra are external-endpoint only.
      # The bare qwen3-vl tags are thinking models (empty captions): use -instruct.
      if [ "$$MODEL_FAMILY" = "gemma" ]; then
        case "$$VRAM_TIER" in
          low) MAIN_MODEL="gemma3:4b" ;;
          *)   MAIN_MODEL="gemma3:12b" ;;
        esac
      else
        case "$$VRAM_TIER" in
          low) MAIN_MODEL="qwen3-vl:4b-instruct" ;;
          *)   MAIN_MODEL="qwen3-vl:8b-instruct" ;;
        esac
      fi
      EMBED_MODEL="qwen3-embedding:4b"
      rm -f /tmp/models-ready
      ollama serve & pid=$$!
      trap 'kill $$pid' TERM INT
      until ollama list >/dev/null 2>&1; do sleep 1; done
      ready=1
      for m in "$$EMBED_MODEL" "$$MAIN_MODEL"; do
        if ollama list | grep -q "^$$m "; then echo "==> $$m already present"
        else echo "==> Pulling $$m"; ollama pull "$$m" || { echo "==> Pull of $$m FAILED (network?); restart to retry"; ready=0; }
        fi
      done
      [ "$$ready" = 1 ] && echo "==> Models ready: $$EMBED_MODEL, $$MAIN_MODEL" && touch /tmp/models-ready
      wait $$pid
  # No host port binding needed — the API reaches it via Docker's internal
  # network (http://ollama:11434). Left unpublished so it can't clash with an
  # Ollama already running on the host. Uncomment to expose:
  # ports:
  #   - "${OLLAMA_PORT:-11434}:11434"
  volumes:
    - ${MODELS_DIR:-./data/models}/ollama:/root/.ollama
  networks:
    default:
      # All three variants answer as "ollama" (see src/local_models.py).
      aliases: [ollama]
  healthcheck:
    # Healthy once the server is up AND the tier's models are pulled.
    test: ["CMD-SHELL", "test -f /tmp/models-ready && ollama list >/dev/null"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 3600s
  restart: unless-stopped

services:

  # ── Core ──────────────────────────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: local-vss-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - ${QDRANT_STORAGE_PATH:-${APP_DATA_DIR:-./data}/qdrant}:/qdrant/storage
    restart: unless-stopped

  local-vss-api:
    image: ghcr.io/raidowl/local-vss-api:${LVS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: local-vss-api
    environment:
      # Deployment mode (derived from HARDWARE_TYPE in .env)
      HARDWARE_TYPE: ${HARDWARE_TYPE:-custom}
      VRAM_TIER: ${VRAM_TIER:-mid}
      MODEL_FAMILY: ${MODEL_FAMILY:-qwen}
      # Custom-mode endpoints (ignored in local modes — auto-configured).
      # Backend-agnostic: may point at vLLM, Ollama, MLX, or a cloud API.
      EMBED_URL: ${EMBED_URL:-http://localhost:8001}
      VLM_URL: ${VLM_URL:-http://localhost:8002}
      LLM_URL: ${LLM_URL:-http://localhost:8000}
      EMBED_MODEL: ${EMBED_MODEL:-Qwen/Qwen3-Embedding-4B}
      VLM_MODEL: ${VLM_MODEL:-llava-hf/llava-v1.6-vicuna-7b-hf}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-8B}
      # Infrastructure
      QDRANT_URL: http://qdrant:6333
      LEGACY_INDEX_EMBED_MODEL: ${LEGACY_INDEX_EMBED_MODEL:-}
      DATABASE_URL: sqlite+aiosqlite:////data/metadata.db
      FRAME_EXTRACTION_INTERVAL: ${FRAME_EXTRACTION_INTERVAL:-5}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-16}
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL:-off}
      # Cache HuggingFace models (reranker, etc.) under the shared models volume
      HF_HOME: /models/huggingface
    volumes:
      # Model weights — relocate to a larger drive by setting MODELS_DIR in .env
      - ${MODELS_DIR:-./data/models}:/models
      # Up to 5 video library directories — set VIDEO_DIR_1..5 in .env
      # Unused slots default to ./data/placeholder (empty dir, auto-created by Docker)
      - ${VIDEO_DIR_1:-./data/videos}:/data/videos/lib1:ro
      - ${VIDEO_DIR_2:-./data/placeholder}:/data/videos/lib2:ro
      - ${VIDEO_DIR_3:-./data/placeholder}:/data/videos/lib3:ro
      - ${VIDEO_DIR_4:-./data/placeholder}:/data/videos/lib4:ro
      - ${VIDEO_DIR_5:-./data/placeholder}:/data/videos/lib5:ro
      - ${APP_DATA_DIR:-./data}:/data
    ports:
      - "${API_PORT:-8000}:8000"
    # Lets HARDWARE_TYPE=apple/native reach Ollama on the host on Linux too
    # (Docker Desktop defines host.docker.internal itself).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The API reports healthy within ~15-30s, then warms the reranker (which
      # stalls /health while it loads and, on first run, downloads ~1.1 GB). The
      # long start_period keeps those warmup stalls from flipping the container
      # to "unhealthy" before the model finishes, so dependents waiting on
      # service_healthy aren't disturbed.
      start_period: 300s
    restart: unless-stopped

  local-vss-frontend:
    image: ghcr.io/raidowl/local-vss-frontend:${LVS_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: local-vss-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      local-vss-api:
        condition: service_healthy
    restart: unless-stopped

  # ── Ollama (default backend) ──────────────────────────────────────────────
  # Exactly one variant starts, picked by COMPOSE_PROFILES=${HARDWARE_TYPE}.
  # Apple Silicon (HARDWARE_TYPE=apple) runs Ollama on the host instead, since
  # Docker on macOS has no Metal access.

  ollama:
    <<: *ollama
    container_name: local-vss-ollama
    profiles: [cpu]

  ollama-nvidia:
    <<: *ollama
    container_name: local-vss-ollama-nvidia
    profiles: [nvidia]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-amd:
    <<: *ollama
    # ROCm build. Detects RDNA 2/3/3.5/4 and Instinct GPUs (incl. Strix Halo
    # gfx1151) natively, no HSA_OVERRIDE_GFX_VERSION needed.
    image: ollama/ollama:0.40.15-rocm
    container_name: local-vss-ollama-amd
    profiles: [amd]
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp:unconfined

  # ── vLLM profile (opt-in) ─────────────────────────────────────────────────
  # Activated when HARDWARE_TYPE=nvidia-vllm or HARDWARE_TYPE=amd-vllm
  # (COMPOSE_PROFILES=${HARDWARE_TYPE} in .env handles this automatically)
  # Higher-precision weights (FP8/BF16 vs Ollama's Q4) and more throughput,
  # but ~24 GB+ of GPU memory. Switching backends requires a re-index.
  # NVIDIA requires: nvidia-container-toolkit installed on host
  # AMD requires: ROCm + docker-compose.rocm.yml override (see .env.example)
  # One multimodal model handles both vision captioning and summarization.

  # Both services start through docker/vllm/serve.py, which picks the model,
  # quantization and memory budget from the GPU it actually sees, on NVIDIA and
  # AMD alike. Quantization is fp8 where the GPU has native FP8 (NVIDIA
  # Ada/Hopper/Blackwell, AMD MI300+), otherwise BF16. Memory is budgeted in GB
  # from what is FREE at startup, so a shared or unified-memory GPU (DGX Spark,
  # Strix Halo) never crash-loops on "free memory is less than desired".
  # vllm-main waits for vllm-embed to finish loading before sizing itself.
  # Overrides: VLLM_GPU_MEMORY_GB (budget), VLLM_GPU_MEMORY_UTIL (raw fraction),
  # VLLM_QUANTIZATION (auto | fp8 | bf16).
  vllm-embed:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.33.0}
    container_name: local-vss-vllm-embed
    profiles: [nvidia-vllm, amd-vllm]
    environment:
      # The bundled API resolves this model from src/local_models.py; custom
      # EMBED_MODEL values apply only when using external endpoints.
      EMBED_MODEL: Qwen/Qwen3-Embedding-4B
      # Caps the embedder's context. Without it vLLM uses the model's native
      # window (40960 for Qwen3-Embedding-4B), whose KV cache does not fit in
      # the embed budget and the engine refuses to start.
      EMBED_MAX_MODEL_LEN: ${VLLM_EMBED_MAX_MODEL_LEN:-8192}
      QUANTIZATION: ${VLLM_QUANTIZATION:-auto}
      GPU_MEMORY_UTIL: ${VLLM_EMBED_GPU_MEMORY_UTIL:-auto}
    entrypoint: [python3, /opt/lvs/serve.py, embed]
    # No host port binding needed — the API reaches this via Docker's internal
    # network (http://vllm-embed:8001). Uncomment to expose for external access:
    # ports:
    #   - "${VLLM_EMBED_PORT:-8001}:8001"
    volumes:
      - ${MODELS_DIR:-./data/models}/huggingface:/root/.cache/huggingface
      - ./docker/vllm/serve.py:/opt/lvs/serve.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 1800s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  vllm-main:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.33.0}
    container_name: local-vss-vllm-main
    profiles: [nvidia-vllm, amd-vllm]
    # The VLM is auto-selected from MODEL_FAMILY + VRAM_TIER, matching the API's
    # tier registry (src/local_models.py). Change it via VRAM_TIER in .env.
    environment:
      MODEL_FAMILY: ${MODEL_FAMILY:-qwen}
      VRAM_TIER: ${VRAM_TIER:-mid}
      # Non-VLLM_-prefixed names so vLLM doesn't flag them as unknown env vars
      MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-16384}
      QUANTIZATION: ${VLLM_QUANTIZATION:-auto}
      GPU_MEMORY_UTIL: ${VLLM_GPU_MEMORY_UTIL:-auto}
      GPU_MEMORY_GB: ${VLLM_GPU_MEMORY_GB:-}
    entrypoint: [python3, /opt/lvs/serve.py, main]
    # No host port binding needed — the API reaches this via Docker's internal
    # network (http://vllm-main:8002). Uncomment to expose for external access:
    # ports:
    #   - "${VLLM_MAIN_PORT:-8002}:8002"
    volumes:
      - ${MODELS_DIR:-./data/models}/huggingface:/root/.cache/huggingface
      - ./docker/vllm/serve.py:/opt/lvs/serve.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 3600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ── Model cache management ────────────────────────────────────────────────
  # List cached models and their disk usage:
  #   docker compose --profile prune run --rm cache-list
  #
  # Delete all cached model weights (vLLM + Ollama). Models re-download on
  # next startup. Stop running model containers first.
  #   docker compose --profile prune run --rm cache-purge

  cache-list:
    image: alpine
    container_name: local-vss-cache-list
    profiles: [prune]
    volumes:
      - ${MODELS_DIR:-./data/models}:/models
    command:
      - sh
      - -c
      - |
        echo "=== HuggingFace models (reranker / vLLM / embed) ==="
        du -sh /models/huggingface/hub/models--* 2>/dev/null \
          | sort -h \
          | sed 's|.*/models--||; s|--|/|' \
          || echo "  (none)"
        echo ""
        echo "=== Ollama models ==="
        du -sh /models/ollama/models/manifests/registry.ollama.ai/*/* 2>/dev/null \
          | sort -h \
          | sed 's|.*/||' \
          || echo "  (none)"
    restart: "no"

  cache-purge:
    image: alpine
    container_name: local-vss-cache-purge
    profiles: [prune]
    volumes:
      - ${MODELS_DIR:-./data/models}:/models
    command:
      - sh
      - -c
      - |
        echo "Clearing HuggingFace cache..."
        rm -rf /models/huggingface/hub && echo "  done"
        echo "Clearing Ollama cache..."
        rm -rf /models/ollama/models && echo "  done"
        echo "All model weights removed. They will re-download on next startup."
    restart: "no"
